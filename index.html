<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sunshine Hotel — AI Voice Agent (Prototype)</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 18px;
        }

        h1 {
            margin: 0 0 14px;
            font-size: 42px;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 16px;
            font-size: 16px;
        }

        #statusPill {
            display: inline-block;
            padding: 4px 10px;
            border: 1px solid #444;
            border-radius: 999px;
            margin-left: 8px;
            user-select: none;
        }

        /* ---------- Voice UX polishing ---------- */
        .pill-idle {
            opacity: 0.8;
        }

        .pill-listening {
            border-color: #b30000;
            font-weight: 700;
            animation: pulse 1s infinite;
        }

        .pill-thinking {
            border-color: #1d4ed8;
            font-weight: 700;
            animation: pulse 1.2s infinite;
        }

        .pill-speaking {
            border-color: #15803d;
            font-weight: 700;
            animation: pulse 1.1s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        #statusText {
            margin: 8px 0 0;
            font-size: 14px;
            color: #333;
        }

        #liveTranscript {
            margin: 10px 0 0;
            font-size: 14px;
            color: #333;
            padding: 8px 10px;
            border: 1px dashed #999;
            border-radius: 8px;
            background: #fafafa;
            min-height: 18px;
        }

        #transcriptBox {
            margin-top: 14px;
            width: 100%;
            height: 220px;
            border: 2px solid #333;
            padding: 10px;
            overflow: auto;
            white-space: pre-wrap;
            background: #fff;
        }

        .panel {
            margin-top: 14px;
            border: 1px solid #999;
            padding: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: 180px 1fr 180px 1fr;
            gap: 10px;
            align-items: center;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
        }

        .small {
            color: #444;
        }

        .muted {
            color: #666;
            font-size: 13px;
        }

        #debugRow {
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h1>Sunshine Hotel — AI Voice Agent (Prototype)</h1>

    <div class="row">
        <button id="startBtn">Start</button>
        <button id="stopBtn" disabled>Stop</button>
        <div style="font-size:20px;">
            <b>Mode:</b> <span id="statusEl">Idle</span>
            <span id="statusPill" class="pill-idle">idle</span>
        </div>
    </div>

    <!-- New: friendly status sentence -->
    <p id="statusText">🎤 Tap Start to speak</p>

    <!-- New: show what the user said (great for demos) -->
    <div id="liveTranscript"></div>

    <p class="small">
        Speak a question (e.g., “What time is check-in?”). The agent answers using FAQ retrieval.
        <span class="muted">Tip: Use Chrome/Edge. Microphone permission must be set to Allow.</span>
    </p>

    <div id="debugRow" class="row">
        <input id="debugInput" type="text" placeholder="Type a question here (debug fallback)..." />
        <button id="sendBtn">Send</button>
        <button id="clearBtn">Clear</button>
    </div>

    <h2>Transcript / Debug</h2>
    <div id="transcriptBox"></div>

    <div class="panel">
        <div class="grid">
            <label for="backendUrl">Backend URL</label>
            <input id="backendUrl" type="text"
                value="https://hotel-voice-agent-backend-575069296077.asia-southeast1.run.app" />

            <label for="faqPath">FAQ Endpoint Path</label>
            <input id="faqPath" type="text" value="/faq/answer" />

            <label for="topK">top_k</label>
            <input id="topK" type="number" value="5" min="1" max="10" />

            <label for="minScore">min_score (optional)</label>
            <input id="minScore" type="text" value="0.35" />
        </div>

        <div class="row" style="margin-top:10px;">
            <label><input id="useMic" type="checkbox" checked /> Use microphone (STT)</label>
            <label><input id="useTts" type="checkbox" checked /> Speak answer (TTS)</label>

            <label for="voiceSelect" style="margin-left:10px;">TTS Voice (optional)</label>
            <select id="voiceSelect">
                <option value="">Default</option>
            </select>
        </div>
    </div>

    <script src="./app.js"></script>
</body>

</html>
