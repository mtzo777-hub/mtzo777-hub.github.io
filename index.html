<!DOCTYPE html>
<html>
<head>
  <title>Sunshine Hotel Voice Agent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      text-align: center;
      padding: 40px;
    }

    h1 { color: #2b6cb0; }

    .card {
      background: white;
      padding: 25px;
      max-width: 650px;
      margin: auto;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    input {
      width: 70%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      border: none;
      background: #2b6cb0;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      margin: 8px;
    }

    .mic {
      background: #e53e3e;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
      min-height: 40px;
    }

    .note {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>🎤 Sunshine Hotel Voice Agent</h1>
  <p>Type OR speak your hotel question</p>

  <input id="question" placeholder="When is check-in time?" />

  <br>
  <button onclick="ask()">Ask</button>
  <button class="mic" onclick="startVoice()">🎤 Speak</button>

  <div id="result"></div>

  <div class="note">
    Tip: Works best in Chrome or Edge browser.
  </div>
</div>

<script>
const API = "https://hotel-voice-agent-backend-575069296077.asia-southeast1.run.app/faq/answer";

async function ask() {
  const q = document.getElementById("question").value;
  if (!q) return;

  document.getElementById("result").innerHTML = "Thinking...";

  const response = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      query: q,
      top_k: 5,
      min_score: 0.35
    })
  });

  const data = await response.json();
  document.getElementById("result").innerHTML =
    "<b>Answer:</b> " + data.answer;
}

function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice not supported. Please use Chrome or Edge.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.start();

  document.getElementById("result").innerHTML = "🎤 Listening...";

  recognition.onresult = function(event) {
    const transcript = event.results[0][0].transcript;
    document.getElementById("question").value = transcript;
    ask();
  };
}
</script>

</body>
</html>
