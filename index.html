<!DOCTYPE html>
<html>
<head>
  <title>Sunshine Hotel Voice Agent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      text-align: center;
      padding: 40px;
    }

    h1 { color: #2b6cb0; }

    .card {
      background: white;
      padding: 25px;
      max-width: 600px;
      margin: auto;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    input {
      width: 80%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      border: none;
      background: #2b6cb0;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
      min-height: 40px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Sunshine Hotel Voice Agent</h1>
    <p>Ask hotel questions:</p>

    <input id="question" placeholder="When is check-in time?" />
    <br>
    <button onclick="ask()">Ask</button>

    <div id="result"></div>
  </div>

<script>
async function ask() {

  const q = document.getElementById("question").value;

  document.getElementById("result").innerHTML = "Thinking...";

  const response = await fetch(
    "https://hotel-voice-agent-backend-575069296077.asia-southeast1.run.app/faq/answer",
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        query: q,
        top_k: 5,
        min_score: 0.35
      })
    }
  );

  const data = await response.json();

  document.getElementById("result").innerHTML =
      "<b>Answer:</b> " + data.answer;
}
</script>

</body>
</html>
